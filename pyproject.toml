[tool.poetry]
name = "text2image"
version = "0.1.6"
description = "Generate images from text"
authors = ["Kodai YAMASHITA <nglcobdai@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pydantic-settings = "^2.14.2"
pytz = "^2024.1"
nglcobdai-utils = {git = "https://github.com/nglcobdai/nglcobdai-utils.git", rev = "5cec1b107453f33b5ad31ab33108e2300f7d0f25"}
diffusers = {extras = ["torch"], version = "^0.38.0"}
transformers = "^5.0.0"
bitsandbytes = "^0.46.1"
protobuf = "^5.29.6"
sentencepiece = "^0.2.1"
optimum-quanto = "^0.2.6"
pynvml = "^11.5.3"
huggingface-hub = "^1.0"
pillow = ">=12.3.0"
click = ">=8.3.3"
setuptools = ">=83.0.0"
torch = {version = ">=2.8.0", source = "pytorch-cu128"}


[tool.poetry.group.dev.dependencies]
pep8 = "^1.7.1"
black = "^26.3.1"
flake8 = "^6.1.0"
isort = "^5.12.0"
ipython = "^8.15.0"
ipykernel = "^6.25.2"
pytest = "^9.0.3"
tornado = ">=6.5.7"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120
